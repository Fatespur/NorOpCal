# Example CI workflow for the NorOpCal staging repository.
#
# This file is a CANDIDATE (.example.yml) and is intentionally NOT enabled:
# it has not been executed on GitHub runners. Review the torch CPU wheel
# size/timeout for your target runner before enabling.
#
# Design constraints honored:
# - no private dataset required (Level-1 verification uses shipped caches)
# - no GPU
# - no secrets
# - runtime dominated by the torch install (~2-5 min) + fast test suite

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Level-1 frozen verification (quick)
        run: |
          python scripts/verify_frozen_results.py --quick

      - name: Tables reproduction
        run: |
          python scripts/reproduce_tables.py

      - name: Unit / integration / parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest -q
