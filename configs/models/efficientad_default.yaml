experiment_name: efficientad_default
dataset:
  name: mvtec_ad
  root: data/mvtec_ad
  categories: [bottle]
  split: train
  image_size: [256, 256]
runtime:
  seed: 0
  device: auto
  output_dir: outputs/efficientad_default
  log_level: INFO
  batch_size: 4
calibration:
  enabled: true
  ratio: 0.1
  seed: 0
  quantile: 0.995
model:
  name: efficientad
  is_fixture: false
  teacher:
    pretrained: true
    checkpoint: null
    allow_download: true
    use_cache: true
    out_channels: 128
  student:
    ae_channels: 128
  training:
    learning_rate: 1.0e-3
    weight_decay: 1.0e-5
    num_steps: 70000
    batch_size: 4
    lambda_global: 1.0
  scoring:
    local_weight: 1.0
    global_weight: 1.0
    smoothing_sigma: 4.0
    image_threshold: null
    pixel_threshold: null
    threshold_source: null
  input_size: [256, 256]
