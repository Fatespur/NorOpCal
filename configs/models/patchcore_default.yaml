experiment_name: patchcore_default
dataset:
  name: mvtec_ad
  root: data/mvtec_ad
  categories: [bottle]
  split: train
  image_size: [224, 224]
runtime:
  seed: 0
  device: auto
  output_dir: outputs/patchcore_default
  log_level: INFO
  batch_size: 4
calibration:
  enabled: true
  ratio: 0.1
  seed: 0
  quantile: 0.995
model:
  name: patchcore
  backbone:
    name: wide_resnet50_2
    layers: [2, 3]
    input_size: [224, 224]
    checkpoint: null
    allow_download: false
    use_cache: true
    dtype: float32
  feature_fusion:
    mode: concat
    normalize: true
    target_grid: [14, 14]
  memory:
    coreset:
      method: kcenter
      ratio: 0.1
      target_size: null
    nearest_neighbors:
      backend: auto
      metric: euclidean
      k: 1
      chunk_size: 1024
  scoring:
    image_aggregation: max
    top_k: 1
    smoothing_sigma: 0.0
    image_threshold: null
    pixel_threshold: null
    threshold_source: null
