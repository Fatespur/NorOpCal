experiment_name: dino_memory_fixture_acceptance
dataset:
  name: synthetic_fixture
  root: data/synthetic_fixture
  categories: [widget]
  split: train
  image_size: [32, 32]
runtime:
  seed: 23
  device: cpu
  output_dir: outputs/dino_memory_fixture
  log_level: INFO
  batch_size: 2
calibration:
  enabled: false
model:
  name: dino_memory
  backbone:
    name: deterministic_fixture
    layers: [0, 1]
    input_size: [32, 32]
    checkpoint: null
    allow_download: false
    use_cache: false
    dtype: float32
    fixture_patch_size: 8
  feature_fusion:
    mode: concat
    normalize: true
    target_grid: [4, 4]
  memory:
    coreset:
      method: kcenter
      ratio: 0.5
      target_size: null
    nearest_neighbors:
      backend: torch
      metric: euclidean
      k: 1
      chunk_size: 16
  scoring:
    image_aggregation: max
    top_k: 1
    smoothing_sigma: 0.0
    image_threshold: 0.05
    pixel_threshold: 0.05
    threshold_source: fixture_predeclared_not_dataset_tuned
