# Phase 4.5 unified baseline comparison protocol.
#
# This file defines the experimental protocol used to produce a fair,
# reproducible comparison between DINOv2 Memory, PatchCore, and EfficientAD
# on five MVTec AD categories with three calibration split seeds.
#
# To regenerate the individual experiment configs, run:
#   python tools/generate_phase45_configs.py
#
# To run the protocol audit on completed experiments, run:
#   python tools/verify_phase45_protocol.py --output-base outputs/phase45_baseline_comparison

categories:
  - bottle
  - cable
  - hazelnut
  - metal_nut
  - transistor

split_seeds:
  - 0
  - 1
  - 2

calibration_ratio: 0.20
threshold_quantile: 0.95

methods:
  - dino_memory
  - patchcore
  - efficientad

method_definitions:
  dino_memory:
    backbone: dinov2_vits14
    layers: [2, 5, 8, 11]
    feature_fusion:
      mode: concat
      normalize: true
      target_grid: null
  patchcore:
    backbone: wide_resnet50_2
    layers: [2, 3]
    feature_fusion:
      mode: concat
      normalize: true
      target_grid: [14, 14]
  efficientad:
    teacher: resnet18_layer2
    teacher_pretrained: true
    teacher_allow_download: false
    student_ae_channels: 128
    training_steps: 70000
    input_size: [256, 256]

shared_parameters:
  image_size: [224, 224]
  batch_size: 4
  coreset_ratio: 0.1
  nearest_neighbors_metric: euclidean
  nearest_neighbors_k: 1
  image_aggregation: max
  dataset_root_env: SHIFTAD_MVTEC_ROOT
  output_base: outputs/phase45_baseline_comparison

# All methods must share the same memory/calibration split for each
# category x seed combination. The split is deterministic given:
#   total_samples, calibration_ratio, seed
# This is enforced by tools/verify_phase45_protocol.py.
#
# Note: EfficientAD uses input_size [256, 256] (standard for the method)
# while DINOv2 Memory and PatchCore use [224, 224]. The calibration split
# is identical because it depends only on (total_samples, ratio, seed).
