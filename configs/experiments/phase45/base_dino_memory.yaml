# Base DINOv2 Memory configuration for Phase 4.5.
#
# This template uses env:SHIFTAD_MVTEC_ROOT for portable dataset root
# injection. Set the environment variable before use:
#   $env:SHIFTAD_MVTEC_ROOT="/path/to/mvtec_ad"
#
# The output_dir uses a relative path. Individual experiment configs
# are generated by tools/generate_phase45_configs.py.

experiment_name: phase45_{category}_dino_seed{seed}
dataset:
  name: mvtec_ad
  root: env:SHIFTAD_MVTEC_ROOT
  categories: [{category}]
  split: train
  image_size: [224, 224]
runtime:
  seed: {runtime_seed}
  device: auto
  output_dir: outputs/phase45_baseline_comparison/{category}_dino_memory_seed{seed}
  log_level: INFO
  batch_size: 4
calibration:
  enabled: true
  ratio: 0.2
  seed: {seed}
  quantile: 0.95
model:
  name: dino_memory
  backbone:
    name: dinov2_vits14
    layers: [2, 5, 8, 11]
    input_size: [224, 224]
    checkpoint: null
    allow_download: true
    use_cache: true
    dtype: float32
  feature_fusion:
    mode: concat
    normalize: true
    target_grid: null
  memory:
    coreset:
      method: kcenter
      ratio: 0.1
      target_size: null
    nearest_neighbors:
      backend: auto
      metric: euclidean
      k: 1
      chunk_size: 1024
  scoring:
    image_aggregation: max
    top_k: 1
    smoothing_sigma: 0.0
    image_threshold: null
    pixel_threshold: null
    threshold_source: null
