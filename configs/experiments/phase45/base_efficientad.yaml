# Base EfficientAD configuration for Phase 4.5 protocol.
#
# This template uses env:SHIFTAD_MVTEC_ROOT for portable dataset root
# injection. Set the environment variable before use:
#   $env:SHIFTAD_MVTEC_ROOT="/path/to/mvtec_ad"
#
# The output_dir uses a relative path. Individual experiment configs
# are generated by tools/generate_phase45_configs.py.
#
# Protocol (must match DINOv2 Memory and PatchCore):
#   calibration_ratio: 0.20
#   threshold_quantile: 0.95
#   split_seeds: 0, 1, 2
#   categories: bottle, cable, hazelnut, metal_nut, transistor
#
# Training steps:
#   The canonical EfficientAD training budget is 70000 steps, matching
#   the reference implementation. This is the default for all formal runs.

experiment_name: phase45_{category}_efficientad_seed{seed}
dataset:
  name: mvtec_ad
  root: env:SHIFTAD_MVTEC_ROOT
  categories: [{category}]
  split: train
  image_size: [256, 256]
runtime:
  seed: {runtime_seed}
  device: auto
  output_dir: outputs/phase45_baseline_comparison/{category}_efficientad_seed{seed}
  log_level: INFO
  batch_size: 4
calibration:
  enabled: true
  ratio: 0.20
  seed: {seed}
  quantile: 0.95
model:
  name: efficientad
  is_fixture: false
  teacher:
    pretrained: true
    checkpoint: null
    allow_download: false
    use_cache: true
    out_channels: 128
  student:
    ae_channels: 128
  training:
    learning_rate: 1.0e-3
    weight_decay: 1.0e-5
    num_steps: 70000
    batch_size: 4
    lambda_global: 1.0
  scoring:
    local_weight: 1.0
    global_weight: 1.0
    smoothing_sigma: 4.0
    image_threshold: null
    pixel_threshold: null
    threshold_source: null
  input_size: [256, 256]
